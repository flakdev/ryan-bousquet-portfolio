<svg viewBox="0 0 980 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clans and Codex system flow: a player joins a clan, contributes to a shared goal, unlocks a reward once the threshold is met, and competes against other clans, which feeds back into further contribution. The same framework ships under different names per title.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- style constants -->
  <!-- stroke: #334155 (slate-700), accent: #b45309 (amber-700), bg boxes: #f8fafc with #cbd5e1 border -->

  <text x="490" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Clans / Codex — reusable progression framework</text>

  <!-- main loop boxes -->
  <!-- 1 Join -->
  <rect x="20" y="130" width="150" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="95" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Join</text>
  <text x="95" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">player joins a clan</text>

  <!-- arrow 1->2 -->
  <line x1="170" y1="165" x2="222" y2="165" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">contributes</text>

  <!-- 2 Contribute -->
  <rect x="222" y="130" width="150" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="297" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Contribute</text>
  <text x="297" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">toward shared goal</text>

  <!-- arrow 2->3 -->
  <line x1="372" y1="165" x2="424" y2="165" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">threshold met</text>

  <!-- 3 Unlock -->
  <rect x="424" y="130" width="150" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="499" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Unlock reward</text>
  <text x="499" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">group reward granted</text>

  <!-- arrow 3->4 -->
  <line x1="574" y1="165" x2="626" y2="165" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">ranked</text>

  <!-- 4 Compete -->
  <rect x="626" y="130" width="150" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="701" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Compete</text>
  <text x="701" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">vs. other clans</text>

  <!-- loop back arrow: from Compete bottom, down, left, up into Contribute bottom -->
  <path d="M 701 200 L 701 245 L 297 245 L 297 200" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="499" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">new cycle / new goal</text>

  <!-- config surface note pointing at the whole loop -->
  <text x="95" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b" font-style="italic">personal track</text>
  <text x="701" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b" font-style="italic">social/competitive layer</text>

  <!-- shipped-as strip -->
  <line x1="20" y1="300" x2="960" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Same mechanics and economy, reskinned per title —</text>
  <text x="330" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">"Clans" (Military Tycoon)</text>
  <text x="490" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#475569">·</text>
  <text x="505" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">"Clubs" (Sonic Speed Simulator)</text>
  <text x="720" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#475569">·</text>
  <text x="735" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">"Codex" (CDT, SSS)</text>
</svg>
